<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社會工作研究方法・課程教材</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--soft:#4b5563;--faint:#9ca3af;--line:#e5e7eb;--blue:#0a6cff;--bg:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.7}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
header{padding:72px 0 36px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--blue);font-weight:700;font-size:15px}
h1{font-size:clamp(2em,6vw,3em);line-height:1.2;margin:10px 0 14px;font-weight:900}
.bar{width:64px;height:6px;border-radius:3px;background:var(--blue);margin:18px 0}
.teacher{font-weight:700;border-left:4px solid var(--blue);padding-left:12px}
.lede{color:var(--soft);max-width:640px;margin:0 0 16px}
main{padding:36px 0 60px}
h2{font-size:1.1em;color:var(--faint);font-weight:700;margin:0 0 14px;letter-spacing:.04em}
.list{display:grid;gap:14px}
a.item{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:22px 24px;transition:border-color .15s,transform .15s}
a.item:hover,a.item:focus-visible{border-color:var(--blue);transform:translateY(-2px);outline:none}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:#eef4ff;border-radius:6px;padding:2px 10px;margin-right:6px}
.item h3{margin:10px 0 6px;font-size:1.3em;font-weight:800}
.item p{margin:0;color:var(--soft)}
.go{display:inline-block;margin-top:12px;color:var(--blue);font-weight:700}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--faint);font-size:14px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">課程教材</div>
  <h1>社會工作研究方法</h1>
  <div class="bar"></div>
  <p class="lede">互動式教學網頁。點進去之後，用鍵盤左右鍵或畫面上的按鈕翻頁。</p>
  <div class="teacher">授課教師　黃瀚諄 老師</div>
</div></header>
<main><div class="wrap">
  <h2>單元列表</h2>
  <div class="list">
    <a class="item" href="questionnaire.html">
      <span class="tag">單元一</span><span class="tag">互動網頁</span>
      <h3>問卷設計與量表</h3>
      <p>問卷設計的六個步驟、四大原則、四種誤差，以及李克特、語意差異、累進、等距量表。可以動手試算李克特量表。</p>
      <span class="go">進入教材 →</span>
    </a>
    <a class="item" href="hypothesis-testing.html">
      <span class="tag">單元二</span><span class="tag">互動投影片</span>
      <h3>實驗設計與假設檢定</h3>
      <p>先學對照組、隨機分派、前後測，再學 H0 與 H1、常態分配、α 與 p 值。全程用「法庭審判」和「正念團體」兩個例子，並說明沒有實驗設計時，假設檢定能說到哪裡。</p>
      <span class="go">進入教材 →</span>
    </a>
  </div>
</div></main>
<footer><div class="wrap">社會工作研究方法・授課教師 黃瀚諄老師。教材中的題目、數字皆為教學示意。</div></footer>
</body>
</html>
